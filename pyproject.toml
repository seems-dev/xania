[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xania"
version = "4.0.5"
description = "A production-grade Python-to-React Full-Stack SPA Framework on Vite and FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["xania", "ui", "spa", "react", "vite", "fastapi", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
xania = "xania.cli:cli"

[tool.setuptools.packages.find]
include = ["xania*"]

[tool.setuptools.package-data]
xania = ["static/*.js", "renderer/*.html", "template/**/*", "template/*", "template/**/.*"]

[project.urls]
Homepage = "https://github.com/seems-dev/xania"
Repository = "https://github.com/seems-dev/xania"
Issues = "https://github.com/seems-dev/xania/issues"

